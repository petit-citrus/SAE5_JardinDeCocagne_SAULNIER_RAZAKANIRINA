
name: CI - Symfony

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests PHP et Symfony
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: ci_secret_for_tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, xml, dom, ctype, iconv, zip
          coverage: none
          tools: composer:v2

      - name: Verifier composer.json
        run: composer validate --no-check-publish

      - name: Installer les dependances
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verifier la syntaxe PHP
        run: |
          find src tests -name "*.php" -print0 |
            xargs -0 -r -n1 php -l

      - name: Executer les tests PHPUnit
        run: php vendor/bin/phpunit
